name: Build Renpy Save File Editor

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      
      - name: Setup Tauri
        run: npm install --legacy-peer-deps
      
      - name: Build Tauri App
        run: npm run tauri build
        env:
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
      
      - name: Upload Windows MSI
        uses: actions/upload-artifact@v4
        with:
          name: renpy-editor-windows
          path: src-tauri/target/release/bundle/msi/
          retention-days: 30
      
      - name: Upload Windows NSIS
        uses: actions/upload-artifact@v4
        with:
          name: renpy-editor-nsis
          path: src-tauri/target/release/bundle/nsis/
          retention-days: 30

  build-debug:
    runs-on: windows-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Install Dependencies
        run: npm install --legacy-peer-deps
      
      - name: Build Debug
        run: cargo build
        working-directory: src-tauri
      
      - name: Upload Debug Binary
        uses: actions/upload-artifact@v4
        with:
          name: renpy-editor-debug
          path: src-tauri/target/debug/app.exe
          retention-days: 7
