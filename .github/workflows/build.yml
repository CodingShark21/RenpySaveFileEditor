name: Build Renpy Save File Editor

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      
      - name: Install MinGW
        run: sudo apt-get update && sudo apt-get install -y mingw-w64
      
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      
      - name: Build frontend
        run: npm run build
      
      - name: Build Rust backend
        run: cargo build --release --target x86_64-pc-windows-gnu
        working-directory: src-tauri
        env:
          CC: x86_64-w64-mingw32-gcc
          AR: x86_64-w64-mingw32-ar
      
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: renpy-editor-exe-release
          path: src-tauri/target/x86_64-pc-windows-gnu/release/app.exe
          retention-days: 30

  build-debug:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      
      - name: Install MinGW
        run: sudo apt-get update && sudo apt-get install -y mingw-w64
      
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      
      - name: Build Debug
        run: cargo build --target x86_64-pc-windows-gnu
        working-directory: src-tauri
        env:
          CC: x86_64-w64-mingw32-gcc
          AR: x86_64-w64-mingw32-ar
      
      - name: Upload Debug Binary
        uses: actions/upload-artifact@v4
        with:
          name: renpy-editor-debug
          path: src-tauri/target/x86_64-pc-windows-gnu/debug/app.exe
          retention-days: 7
